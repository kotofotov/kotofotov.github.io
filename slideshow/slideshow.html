<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Слайдшоу 4:3</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
    }

    .slider {
      width: 90%;
      max-width: 1000px;
      aspect-ratio: 4 / 3;          /* жёсткое соотношение 4:3 */
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      background: #000;
    }

    .slider img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;            /* фото заполняет кадр без искажений */
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .slider img.active {
      opacity: 1;
    }

    /* Точки навигации (по желанию) */
    .dots {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .dot {
      width: 12px;
      height: 12px;
      background: rgba(255,255,255,0.4);
      border-radius: 50%;
      cursor: pointer;
      transition: 0.3s;
    }

    .dot.active {
      background: white;
      transform: scale(1.3);
    }
  </style>
</head>
<body>
<p>&nbsp;</p>
<p>&nbsp;</p>
  <div class="slider">
    <!-- Здесь будут появляться фото -->
    <img class="active" src="photo001.jpg" alt="">
    <img src="photo002.jpg" alt="">
    <img src="photo003.jpg" alt="">
    <img src="photo004.jpg" alt="">
    <img src="photo005.jpg" alt="">
    <img src="photo006.jpg" alt="">
    <img src="photo007.jpg" alt="">
    <img src="photo008.jpg" alt="">
    <img src="photo009.jpg" alt="">
    <img src="photo010.jpg" alt="">
    <img src="photo011.jpg" alt="">
    <img src="photo012.jpg" alt="">
    <img src="photo013.jpg" alt="">
    <img src="photo014.jpg" alt="">
    <img src="photo015.jpg" alt="">
    <img src="photo016.jpg" alt="">
    <img src="photo017.jpg" alt="">
    <img src="photo018.jpg" alt="">
    <img src="photo019.jpg" alt="">
    <img src="photo020.jpg" alt="">

    <div class="dots" id="dots"></div>
  </div>

  <script>
    const images = document.querySelectorAll('.slider img');
    const dotsContainer = document.getElementById('dots');
    let current = 0;
    const intervalTime = 5000; // 5 секунд на фото (можно изменить)

    // Создаём точки
    images.forEach((_, index) => {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (index === 0) dot.classList.add('active');
      dot.addEventListener('click', () => goToSlide(index));
      dotsContainer.appendChild(dot);
    });

    const dots = document.querySelectorAll('.dot');

    function showSlide(index) {
      images.forEach(img => img.classList.remove('active'));
      dots.forEach(dot => dot.classList.remove('active'));

      images[index].classList.add('active');
      dots[index].classList.add('active');
      current = index;
    }

    function nextSlide() {
      let next = current + 1;
      if (next >= images.length) next = 0;
      showSlide(next);
    }

    function goToSlide(index) {
      showSlide(index);
      // Сбрасываем таймер при ручном переключении
      clearInterval(timer);
      timer = setInterval(nextSlide, intervalTime);
    }

    // Автоматическое перелистывание
    let timer = setInterval(nextSlide, intervalTime);
  </script>

</body>
</html>
